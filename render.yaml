# Render Blueprint — Temporary Docker deployment (OpenWA + CarryBee Bridge)
# Defaults to `plan: free` so you can deploy on Render with NO credit card while waiting for your VPS!
# - On 512 MB (`free`/`starter`), `carrybee-start.sh` automatically selects OpenWA's lightweight
#   `baileys` engine so 3+ accounts fit in 512 MB without crashing.
# - On >= 2 GB RAM (your 3 GB KVM VPS, or Render `standard` + Disk), it automatically runs
#   `whatsapp-web.js` (headless Chromium).

services:
  - type: web
    name: carrybee-openwa-bridge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: API_KEY
        sync: false
      - key: ADMIN_KEYS
        sync: false
      - key: TURSO_DB_URL
        sync: false
      - key: TURSO_DB_TOKEN
        sync: false
      - key: NODE_ID
        value: carrybee-openwa-1
      - key: AUTO_START_SESSIONS
        value: "true"
      - key: STATUS_SEED_ON_READY
        value: "false"
      - key: TZ
        value: Asia/Dhaka
