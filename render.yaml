# Render Blueprint — OpenWA Engine Docker deployment (connects automatically to Vercel + Supabase!)
# Defaults to `plan: free` so you can deploy on Render with NO credit card while waiting for your VPS!
# - Set SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY in Render Environment, and this container will
#   automatically register its RENDER_EXTERNAL_URL + OpenWA API Key in Supabase so your permanent
#   Vercel bridge connects immediately!

services:
  - type: web
    name: carrybee-openwa-engine
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_KEYS
        sync: false
      - key: NODE_ID
        value: carrybee-openwa-1
      - key: AUTO_START_SESSIONS
        value: "true"
      - key: STATUS_SEED_ON_READY
        value: "false"
      - key: TZ
        value: Asia/Dhaka
